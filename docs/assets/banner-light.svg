    <g opacity="0.9">
        <circle cx="62" cy="34" r="5" fill="#ec4899"/>
        <rect x="190" y="22" width="10" height="10" rx="2" fill="#f59e0b" transform="rotate(20 195 27)"/>
        <circle cx="168" cy="176" r="4" fill="#22c55e"/>
        <rect x="40" y="158" width="9" height="9" rx="2" fill="#0ea5e9" transform="rotate(-25 44 162)"/>
        <circle cx="660" cy="40" r="4" fill="#22c55e"/>
        <rect x="684" y="150" width="10" height="10" rx="2" fill="#ec4899" transform="rotate(35 689 155)"/>
