# Publishes a GitHub release when a version tag (e.g. v1.2.0) is pushed.
# The release notes come from the matching changie file in .changes/. A
# release candidate tag (e.g. v1.0.0-rc.1) uses the notes of the version it
# precedes (v1.0.0) and is published as a pre-release.
# Create tags with `make tag` after the release commit is on main.
name: Release

on:
    push:
        tags: ["v*"]

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Check the tag matches a changelog entry
              id: notes
              run: |
                  v="${GITHUB_REF_NAME%%-*}"
                  test -f ".changes/$v.md" || { echo "No .changes/$v.md"; exit 1; }
                  echo "file=.changes/$v.md" >> "$GITHUB_OUTPUT"

            - name: Test
              run: |
                  npm ci
                  npm run typecheck
                  npm test

            - name: Publish release
              uses: softprops/action-gh-release@v2
              with:
                  name: ChoreTrack ${{ github.ref_name }}
                  body_path: ${{ steps.notes.outputs.file }}
                  prerelease: ${{ contains(github.ref_name, '-') }}
